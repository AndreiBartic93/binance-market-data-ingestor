#Docker specific Spring Boot configuration.
#This profile is d from docker-compose.yml using: SPRING_PROFILES_ACTIVE=docker

spring:
  application:
    name: binance-market-data-ingestion

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:market_data_ingestion}
    username: ${POSTGRES_USER:market_user}
    password: ${POSTGRES_PASSWORD:market_password}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

binance:
  rest:
    base-url: https://api.binance.com

ingestion:
  scheduled:
    enabled: true
    fixed-delay-ms: 300000
    initial-delay-ms: 30000
    limit: 1000
    max-subscriptions-per-run: 50